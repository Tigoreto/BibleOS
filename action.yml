name: "BibleOS Sovereign Agent Sandbox & Ledger Verifier"
description: "Zero phone-home compliance gatekeeper and cryptographic reality ledger auditor for autonomous AI agents."
author: "Leopard Inc"

branding:
  icon: "shield"
  color: "blue"

inputs:
  target-path:
    description: "Path to agent code or manifest directory to audit"
    required: false
    default: "."
  strict-mode:
    description: "Fail the workflow step if unauthorized egress or compliance breaches are detected"
    required: false
    default: "true"
  allowed-endpoints:
    description: "Comma-separated list of whitelisted external domains (e.g. *.agentuniver.com,api.wuxian.xyz)"
    required: false
    default: ""
  generate-ledger:
    description: "Commit audit event and verification proof into cryptographic Reality Ledger"
    required: false
    default: "true"
  ledger-output:
    description: "Output file path for the persisted Reality Ledger block"
    required: false
    default: "bibleos-ledger.json"

outputs:
  audit-status:
    description: "Audit status outcome: PASSED or VIOLATIONS_DETECTED"
  ledger-hash:
    description: "Cryptographic SHA-256 hash of the chained Reality Ledger block"
  violations-count:
    description: "Total number of intercepted unauthorized egress attempts"

runs:
  using: "node20"
  main: "dist/index.js"
